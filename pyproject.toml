[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pennair-shapes"
version = "0.1.0"
description = "Solid-shape detection on textured backgrounds - PennAir 2024 software challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pennair = "pennair.cli:main"

[tool.setuptools]
packages = ["pennair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
